map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Overwrite client input: in production this is the immediate ALB peer, not a forwarded client IP.
        proxy_set_header X-MedQueue-Ingress-Peer $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Only trust this header because the EC2 security group admits this listener from the ALB.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The ALB is the sole network peer allowed to reach this listener.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
