name: medqueue-production

services:
  backend:
    image: ${MEDQUEUE_BACKEND_IMAGE:?Set MEDQUEUE_BACKEND_IMAGE to an immutable SHA-256 digest reference}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-300}
      AUTH_LOGIN_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_WINDOW_SECONDS:-300}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-120}
      AUTH_REGISTER_RATE_WINDOW_SECONDS: ${AUTH_REGISTER_RATE_WINDOW_SECONDS:-3600}
      DB_URL: ${DB_URL:?Set DB_URL to the private Amazon RDS JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME from the external secret store}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD from the external secret store}
      RDS_TRUSTSTORE_PASSWORD: ${RDS_TRUSTSTORE_PASSWORD:?Set RDS_TRUSTSTORE_PASSWORD from the external secret store}
      RDS_TRUSTSTORE_URL: file:/run/certs/rds-truststore.p12
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET from the external secret store}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to the HTTPS application origin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SERVER_PORT: "8080"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: never
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    volumes:
      - type: bind
        source: ${RDS_TRUSTSTORE_PATH:?Set RDS_TRUSTSTORE_PATH to the mounted PKCS12 truststore on EC2}
        target: /run/certs/rds-truststore.p12
        read_only: true
    expose:
      - "8080"
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    image: ${MEDQUEUE_FRONTEND_IMAGE:?Set MEDQUEUE_FRONTEND_IMAGE to an immutable SHA-256 digest reference}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:?Set WEB_BIND_ADDRESS to the EC2 private IPv4 address}:${WEB_PORT:-80}:80"
    networks:
      - application
      - ingress
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    logging: *default-logging

networks:
  # Bridge networking provides outbound routing through the EC2 host to private RDS.
  # The backend is reachable by Nginx only on this private application network.
  application:
    driver: bridge
  ingress:
    driver: bridge
