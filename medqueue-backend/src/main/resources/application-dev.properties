# Local-only convenience defaults. Never activate the dev profile in a deployed environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medqueue?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
medqueue.jwt.secret=${JWT_SECRET:bWVkcXVldWUtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
medqueue.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
medqueue.auth-rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
medqueue.auth-rate-limit.login.limit=${AUTH_LOGIN_RATE_LIMIT:300}
medqueue.auth-rate-limit.login.window-seconds=${AUTH_LOGIN_RATE_WINDOW_SECONDS:300}
medqueue.auth-rate-limit.registration.limit=${AUTH_REGISTER_RATE_LIMIT:120}
medqueue.auth-rate-limit.registration.window-seconds=${AUTH_REGISTER_RATE_WINDOW_SECONDS:3600}
