# ===============================
# Application
# ===============================
spring.application.name=medqueue-backend

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=true

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# Authentication
# ===============================
medqueue.jwt.secret=${JWT_SECRET}
medqueue.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
medqueue.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
medqueue.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
medqueue.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
