# Require encrypted MySQL transport and validate both the RDS CA chain and endpoint hostname.
# The truststore is generated from the current AWS RDS CA bundle and mounted read-only by Compose.
spring.datasource.hikari.data-source-properties[sslMode]=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties[trustCertificateKeyStoreUrl]=${RDS_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties[trustCertificateKeyStoreType]=PKCS12
spring.datasource.hikari.data-source-properties[trustCertificateKeyStorePassword]=${RDS_TRUSTSTORE_PASSWORD}

# Production never inherits the base development CORS origin or non-health Actuator exposure.
medqueue.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
medqueue.auth-rate-limit.enabled=true
medqueue.auth-rate-limit.login.limit=${AUTH_LOGIN_RATE_LIMIT:300}
medqueue.auth-rate-limit.login.window-seconds=${AUTH_LOGIN_RATE_WINDOW_SECONDS:300}
medqueue.auth-rate-limit.registration.limit=${AUTH_REGISTER_RATE_LIMIT:120}
medqueue.auth-rate-limit.registration.window-seconds=${AUTH_REGISTER_RATE_WINDOW_SECONDS:3600}
