# This profile only targets the dedicated medqueue_test database. Override credentials
# with DB_TEST_* when local MySQL does not use the documented development credentials.
spring.datasource.url=${DB_TEST_URL:jdbc:mysql://localhost:3306/medqueue_test?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_TEST_USERNAME:root}
spring.datasource.password=${DB_TEST_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
medqueue.jwt.secret=${JWT_SECRET:bWVkcXVldWUtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
medqueue.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
medqueue.auth-rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:false}
medqueue.auth-rate-limit.login.limit=${AUTH_LOGIN_RATE_LIMIT:1000}
medqueue.auth-rate-limit.login.window-seconds=${AUTH_LOGIN_RATE_WINDOW_SECONDS:60}
medqueue.auth-rate-limit.registration.limit=${AUTH_REGISTER_RATE_LIMIT:1000}
medqueue.auth-rate-limit.registration.window-seconds=${AUTH_REGISTER_RATE_WINDOW_SECONDS:60}
